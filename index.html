<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le sablier – Argumenter le prix face au vendeur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --purple:#8E2283; --purple-ink:#8E2283; --teal:#22A88D; --pink:#EBBBE6;
  --bg:#FFFFFF; --surface:#F7F4F8; --ink:#26222B; --muted:#625C68; --line:#E4DFE7;
  --paper:#FFFDF9; --paper-ink:#2D2833; --good-bg:#E3F5F0; --mid-bg:#F8E8F6; --bad-bg:#EEECEF;
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --hand:'Kalam','Comic Sans MS','Segoe Print',cursive;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --purple-ink:#D07CC6; --bg:#16131A; --surface:#211C26; --ink:#F1EDF4; --muted:#ADA5B3; --line:#3A3341;
    --good-bg:#173A33; --mid-bg:#3A2238; --bad-bg:#2A2630;
  }
}
:root[data-theme="dark"]{
  --purple-ink:#D07CC6; --bg:#16131A; --surface:#211C26; --ink:#F1EDF4; --muted:#ADA5B3; --line:#3A3341;
  --good-bg:#173A33; --mid-bg:#3A2238; --bad-bg:#2A2630;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(16px,4vw,40px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{display:block;font-weight:800;color:var(--purple-ink);font-size:17px;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:13px}
.hud{display:flex;align-items:center;gap:18px}
.steps{display:flex;gap:6px}
.steps i{width:22px;height:6px;border-radius:3px;background:var(--line);transition:background .3s}
.steps i.done{background:var(--teal)}
.steps i.now{background:var(--purple)}
.meter{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.meter .bar{width:110px;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter .fill{height:100%;width:20%;background:var(--teal);border-radius:5px;transition:width .6s ease}
.meter strong{color:var(--ink);font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
@media (max-width:640px){.steps{display:none}.brand small{display:none}.meter .bar{width:70px}}

/* Layout */
.wrap{max-width:1180px;margin:0 auto;padding:clamp(16px,3vw,36px) clamp(16px,4vw,40px) 48px;display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:clamp(20px,3vw,44px);align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.sheet-col{order:-1}}

/* Paper sheet */
.sheet-col{position:sticky;top:16px}
@media (max-width:900px){.sheet-col{position:static}}
.paper{background:var(--paper);border-radius:6px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 14px 30px -18px rgba(60,20,60,.45);padding:14px 10px 6px;position:relative;
  background-image:repeating-linear-gradient(to bottom,transparent 0 27px,rgba(34,168,141,.12) 27px 28px)}
.paper::before{content:"";position:absolute;left:34px;top:0;bottom:0;width:1px;background:rgba(235,187,230,.9)}
.paper svg{display:block;width:100%;height:auto;max-height:60vh}
@media (max-width:900px){.paper svg{max-height:340px}}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:14px}
.tag{padding:5px 10px;border-radius:999px;background:var(--surface);color:var(--muted)}
.tag b{color:var(--ink);font-weight:700}

svg .hand{font-family:var(--hand);fill:var(--paper-ink)}
svg .draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .9s ease}
svg .draw.on{stroke-dashoffset:0}
svg .write{opacity:0;transform:translateY(4px);transition:opacity .6s ease,transform .6s ease;transform-box:fill-box}
svg .write.on{opacity:1;transform:none}
#sand{transition:transform 1.4s cubic-bezier(.5,0,.3,1)}
#clock{transition:transform 1.4s cubic-bezier(.5,0,.3,1)}

/* Scene */
.intro h1{font-size:clamp(38px,6vw,64px);line-height:1;margin:6px 0 14px;font-weight:800;letter-spacing:-.02em;color:var(--purple-ink)}
.intro .lead{font-size:clamp(18px,2.2vw,21px);max-width:34ch;margin:0 0 22px}
.case{border-left:4px solid var(--teal);background:var(--surface);padding:16px 18px;border-radius:0 8px 8px 0;margin-bottom:22px}
.case dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.case dt{color:var(--muted)}
.case dd{margin:0;font-weight:600}
.howto{color:var(--muted);max-width:56ch;margin:0 0 26px}
.cta{appearance:none;border:0;background:var(--purple);color:#fff;font-weight:700;padding:14px 26px;border-radius:999px;cursor:pointer;font-size:17px;transition:transform .15s}
.cta:hover{transform:translateY(-1px)}
.cta.ghost{background:transparent;color:var(--purple-ink);box-shadow:inset 0 0 0 2px var(--purple-ink)}

.stage h2{font-size:clamp(24px,3vw,30px);margin:0 0 6px;line-height:1.15;font-weight:800}
.stage .num{color:var(--teal);font-weight:800;font-size:15px;margin:0}
.ctx{color:var(--muted);margin:0 0 18px;max-width:62ch}
.bubble{display:flex;gap:12px;align-items:flex-start;margin:0 0 18px}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;background:var(--pink);color:#5d1557;display:grid;place-items:center;font-weight:800}
.avatar.me{background:var(--purple);color:#fff}
.say{background:var(--surface);border-radius:4px 16px 16px 16px;padding:12px 16px;max-width:60ch}
.say small{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:2px}
.ask{font-weight:700;margin:6px 0 10px}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{appearance:none;text-align:left;width:100%;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;line-height:1.45;transition:border-color .2s,background .2s}
.opt:hover:not([disabled]){border-color:var(--purple)}
.opt[disabled]{cursor:default;opacity:.45}
.opt.picked{opacity:1;border-color:var(--purple);background:var(--surface)}

.fb{margin-top:18px;display:none}
.fb.on{display:block;animation:rise .45s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.verdict{display:inline-block;font-weight:800;font-size:14px;padding:4px 12px;border-radius:999px;margin-bottom:12px}
.v-top{background:var(--good-bg);color:var(--teal)}
.v-mid{background:var(--mid-bg);color:var(--purple-ink)}
.v-low{background:var(--bad-bg);color:var(--muted)}
.coach{border-radius:12px;padding:16px 18px;background:var(--surface);margin:14px 0}
.coach p{margin:0}
.coach .ref{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.coach .ref b{display:block;font-size:14px;color:var(--teal)}
.coach .ref q{font-style:italic}

/* End */
.result h1{font-size:clamp(30px,4.5vw,46px);line-height:1.05;margin:4px 0 12px;color:var(--purple-ink);font-weight:800;letter-spacing:-.01em}
.chart{background:var(--surface);border-radius:12px;padding:16px 12px 8px;margin:20px 0;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:480px;height:auto}
.chart text{font-family:var(--font);fill:var(--muted);font-size:12px}
.gap{font-size:clamp(18px,2.2vw,21px);font-weight:700;margin:0 0 6px}
.recap{list-style:none;padding:0;margin:14px 0 26px;display:grid;gap:8px;counter-reset:r}
.recap li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);counter-increment:r}
.recap li::before{content:counter(r);font-weight:800;color:var(--teal)}
.recap span.mark{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M4 16 17 5l13 11v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" fill="#8E2283"/><rect x="13" y="19" width="8" height="12" rx="1" fill="#EBBBE6"/><circle cx="25" cy="9" r="4" fill="#22A88D"/></svg>
    <div><b>La Maison des pros</b><small>Formé ici. Performant partout.</small></div>
  </div>
  <div class="hud" id="hud" aria-label="Progression">
    <div class="steps" id="steps"></div>
    <div class="meter">Adhésion du vendeur <div class="bar"><div class="fill" id="fill"></div></div><strong id="pct">20</strong></div>
  </div>
</header>

<main class="wrap">
  <section id="scene" aria-live="polite"></section>

  <aside class="sheet-col" aria-label="La feuille du rendez-vous">
    <div class="paper">
      <svg viewBox="0 0 400 470" role="img" aria-label="Le sablier dessiné pendant l'entretien">
        <defs>
          <clipPath id="funnelClip"><polygon points="90,40 370,40 320,400 140,400"/></clipPath>
          <marker id="head" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 5 9 10 0" fill="none" stroke="#8E2283" stroke-width="2"/></marker>
        </defs>
        <!-- sand -->
        <g clip-path="url(#funnelClip)">
          <rect id="sand" x="80" y="40" width="300" height="370" fill="#EBBBE6" opacity=".45"/>
        </g>
        <!-- funnel -->
        <path id="funnel" class="draw" pathLength="1" d="M90 40 L370 40 L320 400 M90 40 L140 400" fill="none" stroke="#8E2283" stroke-width="3" stroke-linecap="round"/>
        <text id="t250" class="hand write" x="48" y="28" text-anchor="middle" font-size="22" font-weight="700">250 000</text>
        <!-- time arrow -->
        <path id="arrow" class="draw" pathLength="1" d="M50 44 L50 396" fill="none" stroke="#8E2283" stroke-width="2.5" stroke-linecap="round" marker-end="url(#head)"/>
        <text id="t3m" class="hand write" x="50" y="432" text-anchor="middle" font-size="22" font-weight="700">3 mois</text>
        <g id="clock" style="transform:translateY(0)"><circle cx="50" cy="44" r="7" fill="#22A88D" opacity="0" id="clockDot"/></g>
        <!-- bands -->
        <path id="l1" class="draw" pathLength="1" d="M104 120 L356 120" stroke="#8E2283" stroke-width="2" fill="none"/>
        <path id="l2" class="draw" pathLength="1" d="M115 200 L345 200" stroke="#8E2283" stroke-width="2" fill="none"/>
        <path id="l3" class="draw" pathLength="1" d="M126 280 L334 280" stroke="#8E2283" stroke-width="2" fill="none"/>
        <path id="l4" class="draw" pathLength="1" d="M137 360 L323 360" stroke="#8E2283" stroke-width="2" fill="none"/>
        <text id="b1" class="hand write" x="230" y="90" text-anchor="middle" font-size="25">Fichier acquéreurs</text>
        <text id="b2" class="hand write" x="230" y="170" text-anchor="middle" font-size="25">Communication</text>
        <text id="b3" class="hand write" x="230" y="250" text-anchor="middle" font-size="25">Relance ultime</text>
        <path id="s1" class="draw" pathLength="1" d="M128 70 Q230 86 334 100" stroke="#22A88D" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path id="s2" class="draw" pathLength="1" d="M148 150 Q230 166 314 180" stroke="#22A88D" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path id="s3" class="draw" pathLength="1" d="M138 230 Q230 246 324 262" stroke="#22A88D" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <text id="b4" class="hand write" x="235" y="448" text-anchor="middle" font-size="27" font-weight="700" style="fill:#8E2283">Offre inférieure</text>
        <path id="u4" class="draw" pathLength="1" d="M140 458 Q235 450 332 460" stroke="#8E2283" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="tags">
      <span class="tag">Estimation <b>190 000 – 210 000 €</b></span>
      <span class="tag">Souhait vendeur <b>250 000 €</b></span>
    </div>
  </aside>
</main>

<script>
const SCENES = [
 { title:"L'objection", ctx:"Vous venez de présenter votre estimation : entre 190 000 et 210 000 €. M. Garnier croise les bras.",
   seller:"200 000 € ? Vous plaisantez. Mon voisin a vendu 245 000 € il y a deux ans, et ma cuisine est refaite. Je veux 250 000 €, pas un centime de moins.",
   enter:[], resolve:["funnel","t250"], t:0,
   opts:[
    {q:"top", text:"« Vous souhaitez vendre à 250 000 €. Et à ce prix, soyons honnêtes : nous n'allons pas travailler ensemble. Ce n'est pas dans votre intérêt, et je vais vous expliquer pourquoi. »",
     re:"… Ah bon ? Un agent qui refuse un mandat, c'est nouveau. Expliquez-moi.",
     coach:"Vous reformulez son prix sans le contester, puis vous créez la surprise. Le consultant qui ne court pas après le mandat intrigue : le vendeur passe en mode écoute. Vous écrivez « 250 000 » en haut de la feuille et tracez le sablier."},
    {q:"mid", text:"« Je comprends, mais les chiffres sont clairs : votre maison vaut 200 000 €, pas davantage. »",
     re:"Les chiffres, les chiffres… Vous dites tous ça pour vendre vite.",
     coach:"Juste sur le fond, mais vous opposez un chiffre à une émotion. Le vendeur entend un jugement sur son bien et se braque."},
    {q:"low", text:"« D'accord, on part sur 250 000 € et on ajustera si besoin. »",
     re:"Parfait ! Vous voyez qu'on peut s'entendre.",
     coach:"Vous gagnez le mandat et perdez la vente. Accepter un prix hors marché, c'est programmer des baisses successives… et un vendeur déçu de vous dans trois mois."}
   ]},
 { title:"Le délai", ctx:"Vous prenez une feuille, écrivez « 250 000 » en haut et tracez un grand sablier.",
   seller:"Bon. Et concrètement, ça changerait quoi, mon prix ?",
   enter:[], resolve:["arrow","t3m","clockDot"], t:0,
   opts:[
    {q:"top", text:"« Supposons que j'accepte de m'occuper de la vente. Rappelez-moi le délai que vous vous êtes fixé ? »",
     re:"Trois mois. On a un achat en cours, je ne peux pas traîner.",
     coach:"C'est le vendeur qui donne le délai : c'est sa contrainte, pas la vôtre. Elle devient le fil rouge du raisonnement. Vous écrivez « 3 mois » en bas et tracez la flèche du temps."},
    {q:"mid", text:"« Vous m'avez parlé de 3 mois : à ce prix, c'est intenable. »",
     re:"Intenable ? C'est vous le pro, débrouillez-vous.",
     coach:"L'information est bonne, mais vous concluez à sa place. Faites-lui redire son objectif : on défend toujours mieux ce qu'on a dit soi-même."},
    {q:"low", text:"« Le délai n'est pas un sujet, on prendra le temps qu'il faut. »",
     re:"Ah non ! Moi j'ai trois mois, pas plus.",
     coach:"Vous balayez la contrainte n°1 du vendeur. Sans délai, le sablier ne fonctionne pas : c'est le temps qui rend l'argument concret."}
   ]},
 { title:"Le fichier acquéreurs", ctx:"Premier étage du sablier : les acquéreurs déjà qualifiés de votre portefeuille.",
   seller:"Vous avez bien des acheteurs en attente, non ? Ils vont se battre pour ma maison.",
   enter:["l1","b1"], resolve:["s1"], t:.2,
   opts:[
    {q:"top", text:"« C'est la première chose que je ferai. Ce sont des acquéreurs qualifiés, qui cherchent depuis des semaines : ils connaissent le marché. Quand vous avez acheté votre maison, vous avez choisi la plus chère du marché ? »",
     re:"… Non, évidemment. On avait comparé.",
     coach:"La question fait le travail à votre place : le vendeur se met dans la peau d'un acheteur averti et conclut seul. Vous rayez « Fichier acquéreurs » : premier moyen de vendre, perdu."},
    {q:"mid", text:"« Mes acquéreurs connaissent les prix, ils ne viendront pas à 250 000 €. »",
     re:"Vous n'en savez rien. Il suffit d'un coup de cœur.",
     coach:"Affirmation correcte, mais sans preuve vécue. Une question qui renvoie le vendeur à sa propre expérience d'acheteur pèse bien plus lourd."},
    {q:"low", text:"« Je leur dirai que le prix est négociable, ça les fera venir. »",
     re:"Négociable ? Je n'ai jamais dit ça !",
     coach:"Vous dévalorisez le bien avant la première visite, sans l'accord du vendeur. Et le vrai problème, le prix de départ, reste entier."}
   ]},
 { title:"La communication", ctx:"« Fichier acquéreurs » est rayé. Deuxième étage : la communication du mandat exclusif.",
   seller:"Il y a aussi vos annonces, vos panneaux… Avec toute cette pub, quelqu'un finira bien par craquer.",
   enter:["l2","b2"], resolve:["s2"], t:.45,
   opts:[
    {q:"top", text:"« Je vais tout déployer : panneau, flyers, sites d'annonces. À votre avis, qu'est-ce que ça va m'amener ? … De nouveaux acquéreurs. Et quand vous avez acheté, combien de biens avez-vous visités avant de vous décider ? »",
     re:"Une dizaine, au moins… Ah. Eux aussi vont comparer.",
     coach:"Deux questions, deux constats faits par le vendeur lui-même. Les nouveaux acquéreurs comparent : le bien trop cher sert à faire vendre les autres. Vous rayez « Communication » : deuxième moyen de vendre, perdu."},
    {q:"mid", text:"« La pub amènera des acheteurs, mais ils compareront et iront ailleurs. »",
     re:"Peut-être. Ou peut-être pas.",
     coach:"Raisonnement juste, mais livré tout fait. Sans question, le vendeur peut toujours répondre « peut-être pas »."},
    {q:"low", text:"« Avec 16 millions de vues, il y aura forcément quelqu'un. »",
     re:"Vous voyez ! Donc 250 000, ça passe.",
     coach:"Vous venez de valider sa stratégie. La visibilité ne crée pas la valeur : elle expose un prix trop haut à plus de monde, plus vite."}
   ]},
 { title:"La relance ultime", ctx:"« Communication » est rayé. Le sable a coulé : deux mois sans offre. Le vendeur est stressé, vous aussi.",
   seller:"Et si au bout de deux mois rien ne bouge, on fait quoi ?",
   enter:["l3","b3"], resolve:[], t:.7,
   opts:[
    {q:"top", text:"« On se revoit pour parler… du prix. Supposons, ce n'est qu'une hypothèse, qu'on passe alors au prix du marché, environ 200 000 €. Que va-t-il se passer ? … Oui, elle va se vendre. Je relancerai alors tous ceux qui l'ont vue. Enfin, les survivants : les autres auront acheté ailleurs. »",
     re:"Les survivants… Et ceux-là, ils vont se dire quoi ?",
     coach:"L'hypothèse dédramatise : vous ne demandez pas encore de baisser, vous projetez. Puis vous semez l'idée clé : les acquéreurs restants prennent leur temps parce qu'ils veulent une bonne affaire. Et ils poseront deux questions : depuis combien de temps c'est en vente ? Est-ce négociable ?"},
    {q:"mid", text:"« Il faudra baisser le prix, de toute façon. »",
     re:"On y est. Vous voulez juste que je brade.",
     coach:"Vrai, mais frontal. Sans scénario, la baisse sonne comme une sanction. Le « supposons… » permet d'en parler sans braquer."},
    {q:"low", text:"« On baissera de 5 000 € par mois jusqu'à ce que ça parte. »",
     re:"Bon, petit à petit, ça me paraît raisonnable.",
     coach:"Le piège classique : les petites baisses successives signalent un vendeur sous pression. Chaque baisse attire des offres encore plus basses."}
   ]},
 { title:"L'offre inférieure", ctx:"Il reste une question : comment réagiront ces acquéreurs « survivants » ?",
   seller:"Mais si je baisse à 200 000, ils l'achèteront à 200 000, c'est tout.",
   enter:[], resolve:["s3","b4","u4"], t:1,
   opts:[
    {q:"top", text:"« Quand ils verront que le bien est en vente depuis 3 mois et qu'il a baissé de 50 000 €, quelle sera leur réaction ? … Une offre sous le prix du marché. Est-ce ce que vous voulez ? Alors, que faisons-nous : on se rapproche du prix du marché tout de suite ? »",
     re:"… Vu comme ça. Je ne veux perdre ni du temps, ni de l'argent. Partons sur le prix du marché.",
     coach:"Vous rayez « Relance ultime » et écrivez « Offre inférieure ». Le risque de se tromper de prix de départ est de vendre moins cher que ce qui est possible aujourd'hui."},
    {q:"mid", text:"« Non, ils feront une offre plus basse. Donc signez à 200 000 € aujourd'hui. »",
     re:"Vous me forcez un peu la main, là.",
     coach:"Le fond est juste, mais vous imposez la décision. Terminez par une question ouverte (« Que faisons-nous ? ») : le vendeur choisit, il assume."},
    {q:"low", text:"« Réfléchissez-y tranquillement et rappelez-moi. »",
     re:"D'accord, je vais en parler à ma femme… et voir d'autres agences.",
     coach:"Tout le travail du sablier retombe. Le vendeur a fait le chemin avec vous : c'est maintenant qu'on conclut, pas dans une semaine."}
   ]}
];
const REFLEXES = ["Reformuler le prix sans le contester","Faire dire le délai par le vendeur","Question miroir : « avez-vous acheté le plus cher ? »","Question miroir : « combien de visites avant d'acheter ? »","L'hypothèse et les « survivants »","Conclure par une question"];
const PTS = {top:16, mid:6, low:-6};
const LABEL = {top:["Bonne approche","v-top"], mid:["À affiner","v-mid"], low:["Contre-productif","v-low"]};

let step=-1, score=20, answers=[];
const $=s=>document.querySelector(s);
const scene=$("#scene");

function stepsBar(){
  $("#steps").innerHTML=SCENES.map((_,i)=>`<i class="${i<step?'done':i===step?'now':''}"></i>`).join("");
}
function setScore(v){
  score=Math.max(0,Math.min(100,v));
  $("#fill").style.width=score+"%"; $("#pct").textContent=score;
}
function on(ids,delay=0){ ids.forEach((id,k)=>setTimeout(()=>document.getElementById(id)?.classList.add("on"),delay+k*450)); }
function time(t){
  $("#sand").style.transform=`translateY(${t*360}px)`;
  $("#clock").style.transform=`translateY(${t*342}px)`;
}
function resetSheet(){
  document.querySelectorAll("svg .draw, svg .write").forEach(e=>e.classList.remove("on"));
  $("#clockDot").setAttribute("opacity","0"); time(0);
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function intro(){
  step=-1; answers=[]; setScore(20); resetSheet(); stepsBar();
  scene.innerHTML=`<div class="intro">
    <h1>Le sablier</h1>
    <p class="lead">Votre vendeur veut 250 000 €. Le marché dit 200 000 €. Faites-lui changer d'avis sans jamais le contredire.</p>
    <div class="case"><dl>
      <dt>Vendeur</dt><dd>M. Garnier, maison familiale de 110 m²</dd>
      <dt>Estimation</dt><dd>190 000 – 210 000 €</dd>
      <dt>Son prix</dt><dd>250 000 €</dd>
      <dt>Contexte</dt><dd>Achat en cours, il doit vendre vite</dd>
    </dl></div>
    <p class="howto">Six répliques, six choix. À chaque étape, choisissez ce que vous répondez. Le sablier se dessine sur la feuille au fil de l'entretien, et la jauge montre si le vendeur vous suit.</p>
    <button class="cta" id="go">Commencer l'entretien</button>
  </div>`;
  $("#go").onclick=()=>next();
}

function next(){
  step++; stepsBar();
  if(step>=SCENES.length) return end();
  const s=SCENES[step];
  on(s.enter,200); time(s.t);
  const opts=shuffle(s.opts);
  scene.innerHTML=`<div class="stage">
    <p class="num">Étape ${step+1} sur ${SCENES.length}</p>
    <h2>${s.title}</h2>
    <p class="ctx">${s.ctx}</p>
    <div class="bubble"><div class="avatar" aria-hidden="true">MG</div><div class="say"><small>M. Garnier</small>${s.seller}</div></div>
    <p class="ask">Que répondez-vous ?</p>
    <ul class="opts">${opts.map((o,i)=>`<li><button class="opt" data-i="${i}">${o.text}</button></li>`).join("")}</ul>
    <div class="fb" id="fb"></div>
  </div>`;
  scene.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(opts[+b.dataset.i],b));
  scene.scrollIntoView({behavior:"smooth",block:"start"});
}

function pick(o,btn){
  const s=SCENES[step];
  scene.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  btn.classList.add("picked");
  answers[step]=o.q; setScore(score+PTS[o.q]);
  if(step===1) $("#clockDot").setAttribute("opacity","1");
  on(s.resolve,300);
  const best=s.opts.find(x=>x.q==="top");
  const [lab,cls]=LABEL[o.q];
  const fb=$("#fb");
  fb.innerHTML=`<span class="verdict ${cls}">${lab}</span>
    <div class="bubble"><div class="avatar" aria-hidden="true">MG</div><div class="say"><small>M. Garnier</small>${o.re}</div></div>
    <div class="coach"><p>${o.coach}</p>
      ${o.q!=="top"?`<div class="ref"><b>La formulation qui marche</b><q>${best.text.replace(/^« | »$/g,"")}</q></div>`:""}
    </div>
    <button class="cta" id="nx">${step===SCENES.length-1?"Voir le résultat":"Continuer"}</button>`;
  fb.classList.add("on");
  $("#nx").onclick=next;
  setTimeout(()=>fb.scrollIntoView({behavior:"smooth",block:"nearest"}),100);
}

function end(){
  stepsBar();
  let title, txt;
  if(score>=80){title="Mandat signé au prix du marché"; txt="M. Garnier accepte d'afficher 205 000 €. Il a fait le raisonnement lui-même : il défendra ce prix auprès de son entourage, et de vous dans un mois.";}
  else if(score>=50){title="Mandat signé… à 225 000 €"; txt="Il a fait un pas, pas le bon. Prévoyez dès maintenant un point d'étape à 3 semaines, sablier en main, avec les retours de visites.";}
  else {title="Mandat à 250 000 €, ou pas de mandat"; txt="Le vendeur reste sur son prix. Voici ce que cette stratégie lui coûtera probablement.";}
  const tops=answers.filter(a=>a==="top").length;
  scene.innerHTML=`<div class="result">
    <p class="num" style="color:var(--teal);font-weight:800;margin:0">${tops} bonne${tops>1?'s':''} approche${tops>1?'s':''} sur 6, adhésion ${score} %</p>
    <h1>${title}</h1>
    <p>${txt}</p>
    <div class="chart">${chart()}</div>
    <p class="gap">Afficher trop cher, c'est vendre moins cher, et plus tard.</p>
    <p style="color:var(--muted);margin:0">Simulation pédagogique : 12 000 € et 4 mois de perdus, pour un vendeur qui en avait 3.</p>
    <h2 style="margin:28px 0 0;font-size:22px">Les 6 réflexes du sablier</h2>
    <ol class="recap">${REFLEXES.map((r,i)=>{const [l,c]=LABEL[answers[i]];return `<li><span>${r}</span><span class="mark ${c}">${l}</span></li>`}).join("")}</ol>
    <div class="row"><button class="cta" id="again">Rejouer</button></div>
  </div>`;
  $("#again").onclick=intro;
  scene.scrollIntoView({behavior:"smooth",block:"start"});
}

function chart(){
  const W=560,H=250,L=60,R=20,T=20,B=40;
  const x=m=>L+(m/6)*(W-L-R), y=v=>T+(255-v)/(255-180)*(H-T-B);
  const A=[[0,250],[1.5,250],[2,235],[3,225],[4,215],[5,188]];
  const Bv=[[0,205],[1.25,200]];
  const p=a=>a.map(([m,v],i)=>(i?"L":"M")+x(m).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  let g="";
  [180,200,220,240].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" stroke-opacity=".12"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v} k€</text>`);
  for(let m=0;m<=6;m++) g+=`<text x="${x(m)}" y="${H-14}" text-anchor="middle">${m===0?"Mise en vente":"M"+m}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Comparaison des deux stratégies de prix">
    ${g}
    <path d="${p(A)}" fill="none" stroke="#8E2283" stroke-width="3" stroke-linejoin="round"/>
    <path d="${p(Bv)}" fill="none" stroke="#22A88D" stroke-width="3"/>
    <circle cx="${x(5)}" cy="${y(188)}" r="6" fill="#8E2283"/>
    <circle cx="${x(1.25)}" cy="${y(200)}" r="6" fill="#22A88D"/>
    <text x="${x(5)-8}" y="${y(188)+22}" text-anchor="end" style="fill:#8E2283;font-weight:700">Affiché 250 k€ : vendu 188 000 € après 5 mois</text>
    <text x="${x(1.25)+12}" y="${y(200)+20}" style="fill:#22A88D;font-weight:700">Affiché au prix du marché : vendu 200 000 € en 5 semaines</text>
  </svg>`;
}
intro();
</script>
</body>
</html>
